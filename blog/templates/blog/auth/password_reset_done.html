{% extends "blog/base.html" %}

{% block content %}
<div class="container">
    <div class="auth-container">
        <section class="auth-card" aria-labelledby="reset-heading">
            <div class="auth-header">
                <span class="section-label">CodePulse</span>
                <h1 id="reset-heading">Check your email</h1>
                <p>If an active account matches that address, password reset instructions are on their way.</p>
            </div>
            <a class="auth-link" href="{% url 'login' %}">Back to login</a>
        </section>
    </div>
</div>
{% endblock %}
