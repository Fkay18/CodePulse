{% extends "blog/base.html" %}

{% block content %}
<div class="container">
    <div class="add-blog-container">
        <div class="add-blog-card">

            <div class="add-blog-header">
                <h1>Add New Blog Post</h1>
                <p>Enter the details of your blog post below.</p>
            </div>

            <form method="POST" enctype="multipart/form-data" class="add-blog-form">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="save-blog-btn">
                    Save Blog Post
                </button>
            </form>

        </div>
    </div>
</div>
{% endblock %}
