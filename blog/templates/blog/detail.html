{% extends 'blog/base.html' %}

{% block content %}
<section class="article-detail">
    <div class="container">
        {% if post.unit %}
            <a href="{% url 'unit_articles' post.unit.slug %}" class="article-detail__back">← Back to {{ post.unit.name }}</a>
        {% else %}
            <a href="{% url 'articles' %}" class="article-detail__back">← Back to articles</a>
        {% endif %}

        <article class="article-detail__card">
            <p class="section-label article-detail__label">CodePulse article</p>
            <h1>{{ post.title }}</h1>
            <div class="article-detail__meta">
                <span>By {{ post.author }}</span>
                <span>•</span>
                <span>{{ post.created_at|date:'F j, Y' }}</span>
            </div>

            <img src="{{ post.image_url.url }}" alt="{{ post.title }}">

            <div class="article-detail__content">
                {{ post.content|linebreaks }}
            </div>
        </article>
    </div>
</section>
{% endblock %}
