{% extends 'blog/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow">
        <img src="{{ post.image_url.url }}" class="card-img-top" alt="{{ post.title }}">
        <div class="card-body">
            <h5 class="card-title">{{ post.title }}</h5>
            <p class="card-text">{{ post.content }}</p>
        </div>
    </div>
    {% endblock %}
